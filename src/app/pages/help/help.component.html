<div appFadeInView class="space-y-8">
  <div>
    <h1 class="text-2xl md:text-3xl font-bold tracking-tight">Help Center & Support</h1>
    <p class="text-sm text-slate-500 mt-1">Frequently asked questions and guides on debt simplification.
    </p>
  </div>
  <div class="glass-card p-6 rounded-2xl apple-shadow space-y-4 max-w-3xl">
    @for (faq of faqs; track faq.question) {
      <div class="p-4 bg-slate-50 dark:bg-slate-800/50 rounded-xl">
        <h4 class="font-semibold text-sm mb-1">{{ faq.question }}</h4>
        <p class="text-xs text-slate-400 leading-relaxed">{{ faq.answer }}</p>
      </div>
    }
  </div>
</div>
