<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-100 dark:bg-slate-950 p-4 overflow-y-auto">
    <!-- Background Glow Effects -->
    <div class="absolute -top-32 -left-32 w-80 h-80 bg-blue-500/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-80 h-80 bg-teal-500/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Main Card Container -->
    <div class="relative w-full max-w-md p-8 bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border border-slate-200/80 dark:border-slate-800/80 rounded-3xl shadow-2xl shadow-slate-200/50 dark:shadow-none">

        <!-- Logo & Branding Header -->
        <div class="flex flex-col items-center justify-center mb-8 text-center relative">
            <div class="absolute w-28 h-28 bg-gradient-to-tr from-blue-600/30 via-teal-400/30 to-indigo-500/30 rounded-full blur-xl pointer-events-none"></div>
            <div class="absolute -top-3 w-20 h-20 bg-pink-500/20 rounded-full blur-lg pointer-events-none"></div>

            <!-- PNG Logo Container -->
            <div class="relative flex items-center justify-center mb-3">
                <div class="w-20 h-20 flex items-center justify-center transform hover:scale-105 transition-transform duration-300">
                    <img src="assets/logo.png" alt="AuraPay Logo" class="w-full h-full object-contain drop-shadow-xl">
                </div>
            </div>

            <h2 class="text-2xl font-extrabold tracking-tight bg-gradient-to-r from-slate-900 via-blue-600 to-teal-500 dark:from-white dark:via-blue-400 dark:to-teal-400 bg-clip-text text-transparent">
                Welcome Back
            </h2>
            <p class="text-xs font-semibold uppercase tracking-widest text-slate-400 dark:text-slate-500 mt-1">
                Sign in to AuraPay Smart Ledger
            </p>
        </div>

        <!-- Error Alert -->
        <div *ngIf="errorMessage" class="mb-5 p-3.5 text-sm text-rose-600 bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-900/50 rounded-2xl flex items-center gap-2">
            <span>⚠️</span> {{ errorMessage }}
        </div>

        <!-- Form Fields -->
        <form (submit)="onLogin(); $event.preventDefault()" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-2">Email Address</label>
                <div class="relative">
                    <input
                            type="email"
                            [(ngModel)]="email"
                            name="email"
                            required

                            class="w-full px-4 py-3 bg-slate-50/50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700/80 rounded-2xl text-slate-800 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-600/50 focus:border-blue-600 transition-all text-sm">
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-2">
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300">Password</label>
                </div>
                <div class="relative">
                    <input
                            type="password"
                            [(ngModel)]="password"
                            name="password"
                            required

                            class="w-full px-4 py-3 bg-slate-50/50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700/80 rounded-2xl text-slate-800 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-600/50 focus:border-blue-600 transition-all text-sm">
                </div>
            </div>

            <button
                    type="submit"
                    class="w-full mt-2 py-3.5 bg-gradient-to-r from-blue-600 to-teal-600 hover:from-blue-700 hover:to-teal-700 text-white font-bold rounded-2xl shadow-lg shadow-blue-500/25 transition-all duration-300 transform active:scale-[0.98] cursor-pointer text-sm">
                Sign In to Account
            </button>

            <div class="text-center text-sm text-slate-500 dark:text-slate-400 pt-2">
                Don't have an account?
                <a routerLink="/register" class="text-blue-600 dark:text-blue-400 font-bold hover:underline cursor-pointer ml-1">Create account</a>
            </div>
        </form>
    </div>
</div>
