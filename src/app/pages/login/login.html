<div class="flex min-h-screen items-center justify-center bg-slate-50 dark:bg-slate-900">
    <div class="w-full max-w-md p-8 bg-white dark:bg-slate-800 rounded-xl shadow-lg">
        <h2 class="text-2xl font-bold text-center text-slate-800 dark:text-white mb-6">AuraPay Login</h2>

        <div *ngIf="errorMessage" class="mb-4 p-3 text-sm text-red-500 bg-red-100 rounded-lg">
            {{ errorMessage }}
        </div>

        <form (submit)="onLogin(); $event.preventDefault()">
            <div class="mb-4">
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Email</label>
                <input
                        type="email"
                        [(ngModel)]="email"
                        name="email"
                        required
                        class="w-full px-4 py-2 border rounded-lg dark:bg-slate-700 dark:border-slate-600 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Password</label>
                <input
                        type="password"
                        [(ngModel)]="password"
                        name="password"
                        required
                        class="w-full px-4 py-2 border rounded-lg dark:bg-slate-700 dark:border-slate-600 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <button
                    type="submit"
                    class="w-full py-2 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition duration-200">
                Login
            </button>
        </form>
    </div>
</div>
