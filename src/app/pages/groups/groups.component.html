<div appFadeInView class="space-y-8">
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
    <div>
      <h1 class="text-2xl md:text-3xl font-bold tracking-tight">Groups & Multi-Split</h1>
      <p class="text-sm text-slate-500 mt-1">Manage shared trips, housemates, and event expenses
        effortlessly.</p>
    </div>
    <button (click)="createGroup()"
      class="px-4 py-2 bg-primary text-white rounded-xl text-sm font-medium shadow-lg shadow-primary/25">Create
      Group</button>
  </div>
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <div class="glass-card p-6 rounded-2xl apple-shadow space-y-4 hover:border-primary/40 transition-all">
      <div class="flex items-center justify-between">
        <h3 class="font-bold text-lg">🇯🇵 Tokyo Trip 2026</h3>
        <span class="px-2.5 py-1 bg-emerald-500/10 text-emerald-500 text-xs font-semibold rounded-lg">Active</span>
      </div>
      <p class="text-xs text-slate-400">5 members • Total spent: $3,450.00</p>
      <div class="w-full bg-slate-200 dark:bg-slate-700 h-2 rounded-full overflow-hidden">
        <div class="bg-primary h-full w-[70%]"></div>
      </div>
      <button (click)="manageGroup('Tokyo Trip')"
        class="w-full py-2 bg-slate-100 dark:bg-slate-800 text-sm font-medium rounded-xl hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">Manage
        Group</button>
    </div>
    <div class="glass-card p-6 rounded-2xl apple-shadow space-y-4 hover:border-primary/40 transition-all">
      <div class="flex items-center justify-between">
        <h3 class="font-bold text-lg">🏠 Downtown Apartment</h3>
        <span class="px-2.5 py-1 bg-emerald-500/10 text-emerald-500 text-xs font-semibold rounded-lg">Active</span>
      </div>
      <p class="text-xs text-slate-400">3 members • Monthly rent & utilities</p>
      <div class="w-full bg-slate-200 dark:bg-slate-700 h-2 rounded-full overflow-hidden">
        <div class="bg-emerald-500 h-full w-[45%]"></div>
      </div>
      <button (click)="manageGroup('Apartment')"
        class="w-full py-2 bg-slate-100 dark:bg-slate-800 text-sm font-medium rounded-xl hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">Manage
        Group</button>
    </div>
  </div>
</div>
