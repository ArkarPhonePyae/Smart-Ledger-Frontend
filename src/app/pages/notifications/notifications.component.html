<div appFadeInView class="space-y-8">
  <div>
    <h1 class="text-2xl md:text-3xl font-bold tracking-tight">Notification Center</h1>
    <p class="text-sm text-slate-500 mt-1">All system alerts, payment reminders, and group updates.</p>
  </div>
  <div class="glass-card p-6 rounded-2xl apple-shadow space-y-4 max-w-3xl">
    @for (n of notifications; track n.title) {
      <div class="flex items-center justify-between p-4 bg-slate-50 dark:bg-slate-800/50 rounded-xl border-l-4"
        [ngClass]="n.borderClass">
        <div>
          <h4 class="font-semibold text-sm">{{ n.title }}</h4>
          <p class="text-xs text-slate-400">{{ n.message }}</p>
        </div>
        <span class="text-[10px] text-slate-400">{{ n.time }}</span>
      </div>
    }
  </div>
</div>
