<div appFadeInView class="space-y-8">
  <div>
    <h1 class="text-2xl md:text-3xl font-bold tracking-tight">Account & Security Settings</h1>
    <p class="text-sm text-slate-500 mt-1">Manage your currency, profile preferences, and security
      tokens.</p>
  </div>
  <!-- Settings Tabs -->
  <div class="flex gap-2 border-b border-slate-200 dark:border-slate-800 pb-4">
    @for (tab of tabs; track tab) {
      <button (click)="setTab(tab)"
        class="px-4 py-2 text-xs font-semibold rounded-xl transition-colors"
        [class.bg-primary]="activeTab === tab"
        [class.text-white]="activeTab === tab"
        [class.shadow-md]="activeTab === tab"
        [class.bg-slate-100]="activeTab !== tab"
        [class.dark:bg-slate-800]="activeTab !== tab"
        [class.text-slate-600]="activeTab !== tab"
        [class.dark:text-slate-400]="activeTab !== tab"
        [class.hover:bg-slate-200]="activeTab !== tab">{{ tab }}</button>
    }
  </div>
  <div class="glass-card p-6 rounded-2xl apple-shadow space-y-6 max-w-2xl">
    <div class="flex items-center justify-between">
      <div>
        <h4 class="font-semibold text-sm">Default Currency</h4><span
          class="text-xs text-slate-400">Choose your base settlement currency</span>
      </div>
      <select class="px-4 py-2 bg-slate-100 dark:bg-slate-800 rounded-xl text-sm outline-none font-medium">
        <option>USD ($)</option>
        <option>EUR (€)</option>
        <option>MMK (Ks)</option>
      </select>
    </div>
    <div class="flex items-center justify-between border-t border-slate-200 dark:border-slate-800 pt-4">
      <div>
        <h4 class="font-semibold text-danger text-sm">Delete Account</h4><span
          class="text-xs text-slate-400">Permanently remove all data and logs</span>
      </div>
      <button (click)="confirmDelete()"
        class="px-4 py-2 bg-danger/10 hover:bg-danger/20 text-danger text-sm font-semibold rounded-xl transition-colors">Delete</button>
    </div>
  </div>
</div>
