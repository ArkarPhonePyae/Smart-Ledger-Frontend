<div class="glass-card p-6 rounded-2xl apple-shadow space-y-6 max-w-2xl">
    <div>
        <h3 class="font-bold text-base">Subscription & Billing</h3>
        <p class="text-xs text-slate-400 mt-0.5">Manage your membership plan and billing details.</p>
    </div>

    <div class="p-4 bg-slate-50 dark:bg-slate-800/50 rounded-xl border border-slate-200 dark:border-slate-700 flex items-center justify-between">
        <div>
            <span class="text-xs font-bold px-2.5 py-1 rounded-full"
                  [ngClass]="isPro ? 'bg-emerald-500/10 text-emerald-500' : 'bg-slate-500/10 text-slate-500'">
                {{ planName }}
            </span>
            <h4 class="font-bold text-lg mt-2">{{ isPro ? '$99.00 / year' : 'Free Plan' }}</h4>
            <p class="text-xs text-slate-400 mt-1">
                {{ isPro ? 'Renews automatically on ' + renewalDate : 'Upgrade to Pro to unlock advanced AI analytics & insights.' }}
            </p>
        </div>

        @if (!isPro) {
            <button (click)="upgrade()"
                    class="px-4 py-2.5 bg-primary text-white text-sm font-semibold rounded-xl shadow-lg shadow-primary/25 hover:opacity-90 transition-opacity">
                Upgrade to Pro 🚀
            </button>
        } @else {
            <span class="text-xs font-semibold text-emerald-500 flex items-center gap-1">✓ Active Member</span>
        }
    </div>
</div>
