<div class="fixed bottom-6 right-6 z-50 space-y-3 pointer-events-none">
  @for (toast of toasts(); track toast.id) {
    <div
      [@toastAnim]
      class="text-white px-4 py-3 rounded-2xl shadow-xl text-xs font-semibold flex items-center gap-3 pointer-events-auto"
      [ngClass]="bgClass(toast.type)">
      <lucide-icon [name]="icon(toast.type)" class="w-4 h-4"></lucide-icon>
      <span>{{ toast.message }}</span>
    </div>
  }
</div>
