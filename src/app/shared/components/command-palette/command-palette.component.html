@if (isOpen()) {
  <div
    class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-start justify-center pt-24 px-4 transition-all">
    <div
      class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden animate-modal">
      <div class="p-4 border-b border-slate-100 dark:border-slate-800 flex items-center gap-3">
        <lucide-icon name="search" class="w-5 h-5 text-slate-400"></lucide-icon>
        <input #commandInput type="text" placeholder="Type a command or search views..."
          class="w-full bg-transparent outline-none text-sm font-medium">
        <button (click)="close()"
          class="text-xs px-2 py-1 bg-slate-100 dark:bg-slate-800 rounded-lg text-slate-500">ESC</button>
      </div>
      <div class="p-2 space-y-1 text-sm">
        <div (click)="goTo('dashboard')"
          class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer">
          <lucide-icon name="layout-dashboard" class="w-4 h-4 text-primary"></lucide-icon> <span>Go to Dashboard</span>
        </div>
        <div (click)="goTo('expenses')"
          class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer">
          <lucide-icon name="receipt" class="w-4 h-4 text-indigo-500"></lucide-icon> <span>Manage Expenses</span>
        </div>
        <div (click)="goTo('groups')"
          class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer">
          <lucide-icon name="users" class="w-4 h-4 text-success"></lucide-icon> <span>View Groups & Splits</span>
        </div>
        <div (click)="goTo('settings')"
          class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer">
          <lucide-icon name="settings" class="w-4 h-4 text-warning"></lucide-icon> <span>Open Settings</span>
        </div>
      </div>
    </div>
  </div>
}
